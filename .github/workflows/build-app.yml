{"name":"build-app","on":{"workflow_dispatch":{},"push":{"paths":["callapp.tgz",".github/workflows/build-app.yml"]}},"permissions":{"contents":"write"},"jobs":{"build":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"name":"Unpack","run":"mkdir app-src && tar xzf callapp.tgz -C app-src"},{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":"17"}},{"uses":"gradle/actions/setup-gradle@v4","with":{"gradle-version":"8.9"}},{"name":"Build","working-directory":"app-src","continue-on-error":true,"run":"set -o pipefail; gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee $GITHUB_WORKSPACE/build.log"},{"name":"Collect","if":"always()","run":"cp app-src/app/build/outputs/apk/release/app-release.apk happyplan-call.apk 2>/dev/null || true; tail -c 40000 build.log > build.tail.log || true; git config user.email ci@happyplan; git config user.name ci; git checkout --orphan ci-out; git reset; git add -f build.log build.tail.log happyplan-call.apk 2>/dev/null || true; git commit -m 'ci output' || echo nothing; git push -f origin ci-out"},{"name":"Release","if":"success()","uses":"softprops/action-gh-release@v2","with":{"tag_name":"app-latest","name":"happyplan-call","files":"happyplan-call.apk"}}]}}}
