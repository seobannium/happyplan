{"name":"build-app","on":{"workflow_dispatch":{},"push":{"paths":["callapp.tgz",".github/workflows/build-app.yml"]}},"permissions":{"contents":"write"},"jobs":{"build":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"name":"Unpack","run":"mkdir app-src && tar xzf callapp.tgz -C app-src"},{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":"17"}},{"uses":"gradle/actions/setup-gradle@v4","with":{"gradle-version":"8.9"}},{"name":"Build","continue-on-error":true,"run":"set +e; cd \"$GITHUB_WORKSPACE/app-src\" || exit 0; gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee \"$GITHUB_WORKSPACE/build.log\"; echo \"GRADLE_EXIT ${PIPESTATUS[0]}\" | tee -a \"$GITHUB_WORKSPACE/build.log\""},{"name":"Collect","if":"always()","run":"set +e; cd \"$GITHUB_WORKSPACE\"; { echo \"== ls workspace ==\"; ls -la; echo \"== find outputs ==\"; find app-src/app/build/outputs -type f 2>/dev/null; echo \"== build.log size ==\"; wc -c build.log 2>/dev/null; echo \"== app-src top ==\"; ls -la app-src; } > debug.txt 2>&1; cp app-src/app/build/outputs/apk/release/app-release.apk happyplan-call.apk 2>/dev/null; git checkout --orphan ci-out; git rm -rf --cached . >/dev/null 2>&1; git add -f build.log debug.txt happyplan-call.apk 2>/dev/null; git -c user.email=ci@h -c user.name=ci commit --allow-empty -m out; git push -f origin ci-out"},{"name":"Release","if":"success()","uses":"softprops/action-gh-release@v2","with":{"tag_name":"app-latest","name":"happyplan-call","files":"happyplan-call.apk"}}]}}}
