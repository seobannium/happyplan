{"name":"build-app","on":{"workflow_dispatch":{},"push":{"paths":["callapp.tgz",".github/workflows/build-app.yml"]}},"permissions":{"contents":"write"},"jobs":{"build":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"name":"Unpack","run":"mkdir app-src && tar xzf callapp.tgz -C app-src"},{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":"17"}},{"uses":"gradle/actions/setup-gradle@v4","with":{"gradle-version":"8.9"}},{"name":"Build","continue-on-error":true,"run":"cd app-src && (gradle assembleRelease --no-daemon --stacktrace > \"$GITHUB_WORKSPACE/build.log\" 2>&1; echo \"GRADLE_EXIT=$?\" >> \"$GITHUB_WORKSPACE/build.log\")"},{"name":"Collect","if":"always()","run":"cp app-src/app/build/outputs/apk/release/app-release.apk happyplan-call.apk 2>/dev/null || true; tail -c 60000 build.log > build.tail.log 2>/dev/null || true; git checkout --orphan ci-out; git reset -q; git add -f build.log build.tail.log happyplan-call.apk 2>/dev/null || true; git -c user.email=ci@happyplan -c user.name=ci commit --allow-empty -m \"ci output\"; git push -f origin ci-out"},{"name":"Release","if":"success()","uses":"softprops/action-gh-release@v2","with":{"tag_name":"app-latest","name":"happyplan-call","files":"happyplan-call.apk"}}]}}}
